<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ecom.css">
</head>
<body>

    <div class="navbar">
        <h2>Naruto Shop</h2>
        <div>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </div>
    </div>

    <div class="banner">
        <h1>Welcome to Naruto Shop</h1>
        <p>Buy your favourite products at best prices!</p>
        <button>Shop Now</button>
    </div>

    <h2 class="heading" id="products">Our Products</h2>

    <div class="products">

        <div class="card">
            <img src="./assets/headphone.jpg" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="./assets/smartwatch.jpg" alt="Watch">
            <h3>Smart Watch</h3>
            <p>Price: ₹799</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="./assets/sports shoe.jpg" alt="Shoes">
            <h3>Sports Shoes</h3>
            <p>Price: ₹1499</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="./assets/t shirts.jpg" alt="T-shirt">
            <h3>T-Shirt</h3>
            <p>Price: ₹499</p>
            <button>Add to Cart</button>
        </div>

    </div>

    <div class="footer" id="contact">
        <h3>Naruto Shop</h3>
        <p>Contact: narutoshop@gmail.com</p>
        <p>© 2026 Naruto Shop</p>
    </div>

</body>
</html>
